name: lab11_sharding
services:
  cfg1:
    image: mongo:7.0
    container_name: lab11-cfg1
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27019", "--bind_ip_all"]
    volumes: [cfg1_data:/data/db]
    networks: [lab11net]
  cfg2:
    image: mongo:7.0
    container_name: lab11-cfg2
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27019", "--bind_ip_all"]
    volumes: [cfg2_data:/data/db]
    networks: [lab11net]
  cfg3:
    image: mongo:7.0
    container_name: lab11-cfg3
    command: ["mongod", "--configsvr", "--replSet", "cfgrs", "--port", "27019", "--bind_ip_all"]
    volumes: [cfg3_data:/data/db]
    networks: [lab11net]

  s1a:
    image: mongo:7.0
    container_name: lab11-s1a
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all"]
    volumes: [s1a_data:/data/db]
    networks: [lab11net]
  s1b:
    image: mongo:7.0
    container_name: lab11-s1b
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all"]
    volumes: [s1b_data:/data/db]
    networks: [lab11net]
  s1c:
    image: mongo:7.0
    container_name: lab11-s1c
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all"]
    volumes: [s1c_data:/data/db]
    networks: [lab11net]

  s2a:
    image: mongo:7.0
    container_name: lab11-s2a
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27018", "--bind_ip_all"]
    volumes: [s2a_data:/data/db]
    networks: [lab11net]
  s2b:
    image: mongo:7.0
    container_name: lab11-s2b
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27018", "--bind_ip_all"]
    volumes: [s2b_data:/data/db]
    networks: [lab11net]
  s2c:
    image: mongo:7.0
    container_name: lab11-s2c
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27018", "--bind_ip_all"]
    volumes: [s2c_data:/data/db]
    networks: [lab11net]

  mongos:
    image: mongo:7.0
    container_name: lab11-mongos
    depends_on: [cfg1, cfg2, cfg3, s1a, s1b, s1c, s2a, s2b, s2c]
    command: ["mongos", "--configdb", "cfgrs/lab11-cfg1:27019,lab11-cfg2:27019,lab11-cfg3:27019", "--bind_ip_all", "--port", "27017"]
    ports: ["27317:27017"]
    networks: [lab11net]
    restart: unless-stopped

networks:
  lab11net:
    name: lab11_sharding_net
    driver: bridge

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  s1a_data:
  s1b_data:
  s1c_data:
  s2a_data:
  s2b_data:
  s2c_data:
