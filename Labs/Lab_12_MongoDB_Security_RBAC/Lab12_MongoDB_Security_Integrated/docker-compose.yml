services:
  certgen:
    image: alpine:3.20
    container_name: lab12-certgen
    command: ["/bin/sh", "-lc", "apk add --no-cache openssl >/dev/null 2>&1 && /certs/generate-certs.sh"]
    volumes:
      - ./certs:/certs
      - ./secrets:/secrets
    networks: [lab12_security_net]

  sec1:
    image: mongo:7.0
    container_name: lab12-sec1
    hostname: sec1
    depends_on:
      certgen:
        condition: service_completed_successfully
    command: >
      mongod --replSet secrs --bind_ip_all --port 27017
      --keyFile /run/secrets/mongo-keyfile
      --setParameter enableLocalhostAuthBypass=1
      --tlsMode requireTLS
      --tlsAllowConnectionsWithoutCertificates
      --tlsCertificateKeyFile /certs/server.pem
      --tlsCAFile /certs/ca.crt
    volumes:
      - sec1_data:/data/db
      - ./secrets:/run/secrets:ro
      - ./certs:/certs:ro
    networks:
      lab12_security_net:
        aliases: [sec1]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --tls --tlsCAFile /certs/ca.crt --tlsCertificateKeyFile /certs/client.pem --tlsAllowInvalidHostnames --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  sec2:
    image: mongo:7.0
    container_name: lab12-sec2
    hostname: sec2
    depends_on:
      certgen:
        condition: service_completed_successfully
    command: >
      mongod --replSet secrs --bind_ip_all --port 27017
      --keyFile /run/secrets/mongo-keyfile
      --setParameter enableLocalhostAuthBypass=1
      --tlsMode requireTLS
      --tlsAllowConnectionsWithoutCertificates
      --tlsCertificateKeyFile /certs/server.pem
      --tlsCAFile /certs/ca.crt
    volumes:
      - sec2_data:/data/db
      - ./secrets:/run/secrets:ro
      - ./certs:/certs:ro
    networks:
      lab12_security_net:
        aliases: [sec2]

  sec3:
    image: mongo:7.0
    container_name: lab12-sec3
    hostname: sec3
    depends_on:
      certgen:
        condition: service_completed_successfully
    command: >
      mongod --replSet secrs --bind_ip_all --port 27017
      --keyFile /run/secrets/mongo-keyfile
      --setParameter enableLocalhostAuthBypass=1
      --tlsMode requireTLS
      --tlsAllowConnectionsWithoutCertificates
      --tlsCertificateKeyFile /certs/server.pem
      --tlsCAFile /certs/ca.crt
    volumes:
      - sec3_data:/data/db
      - ./secrets:/run/secrets:ro
      - ./certs:/certs:ro
    networks:
      lab12_security_net:
        aliases: [sec3]

  setup:
    image: python:3.12-slim
    container_name: lab12-setup
    working_dir: /work
    depends_on:
      sec1:
        condition: service_started
      sec2:
        condition: service_started
      sec3:
        condition: service_started
    network_mode: "service:sec1"
    environment:
      MONGO_URI: "mongodb://sec1:27017,sec2:27017,sec3:27017/?replicaSet=secrs&tls=true&tlsCAFile=/certs/ca.crt&tlsCertificateKeyFile=/certs/client.pem&tlsAllowInvalidHostnames=true"
      ADMIN_USER: "lab12_admin"
      ADMIN_PASSWORD: "${LAB12_ADMIN_PASSWORD:?Set LAB12_ADMIN_PASSWORD in your shell or local .env file}"
      LAB7_MONGODB_URI: "${LAB7_MONGODB_URI:-}"
      LAB7_DATABASE: "${LAB7_DATABASE:-cti_cisa_kev}"
      LAB7_COLLECTION: "${LAB7_COLLECTION:-indicators}"
    volumes:
      - ./scripts:/work
      - ./certs:/certs:ro
    command: sh -c "pip install --no-cache-dir pymongo==4.10.1 && python setup_lab12.py"
    restart: "no"

networks:
  lab12_security_net:
    name: lab12_security_net
    driver: bridge

volumes:
  sec1_data:
    name: lab12_sec1_data
  sec2_data:
    name: lab12_sec2_data
  sec3_data:
    name: lab12_sec3_data
