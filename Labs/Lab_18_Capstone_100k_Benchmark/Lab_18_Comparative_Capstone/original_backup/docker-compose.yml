services:
  mongodb:
    image: mongo:7
    container_name: lab18-mongodb
    restart: unless-stopped
    ports:
      - "27223:27017"
    volumes:
      - lab18_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  lab18_mongo_data:
