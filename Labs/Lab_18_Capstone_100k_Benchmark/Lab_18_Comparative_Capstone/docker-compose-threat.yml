services:
  threat-mongodb:
    image: mongo:7
    container_name: threat-mongodb
    ports:
      - "27224:27017"
    volumes:
      - threat_mongo_data:/data/db

  threat-cassandra:
    image: cassandra:4.1
    container_name: threat-cassandra
    ports:
      - "9043:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - threat_cassandra_data:/var/lib/cassandra

  threat-neo4j:
    image: neo4j:5
    container_name: threat-neo4j
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in your local environment}
    volumes:
      - threat_neo4j_data:/data

volumes:
  threat_mongo_data:
  threat_cassandra_data:
  threat_neo4j_data:
