apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: nosql-labs
spec:
  serviceName: mongo-headless-svc
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      initContainers:
        - name: prepare-keyfile
          image: busybox:1.36
          command: ["sh", "-c", "cp /keyfile-source/keyfile /keyfile-work/keyfile && chown 999:999 /keyfile-work/keyfile && chmod 400 /keyfile-work/keyfile"]
          volumeMounts:
            - name: keyfile-secret
              mountPath: /keyfile-source
              readOnly: true
            - name: keyfile-work
              mountPath: /keyfile-work
      containers:
        - name: mongodb
          image: mongo:7
          command: ["mongod", "--replSet=rs0", "--bind_ip_all", "--auth", "--keyFile=/etc/mongodb-keyfile/keyfile"]
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: keyfile-work
              mountPath: /etc/mongodb-keyfile
              readOnly: true
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongo-keyfile
            defaultMode: 0400
        - name: keyfile-work
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
